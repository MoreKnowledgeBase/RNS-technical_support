<script>
function updateAUTimes(){
  const cities = [
    {name:"Sydney", tz:"Australia/Sydney"},
    {name:"Melbourne", tz:"Australia/Melbourne"},
    {name:"Canberra", tz:"Australia/Canberra"},
    {name:"Brisbane", tz:"Australia/Brisbane"},
    {name:"Adelaide", tz:"Australia/Adelaide"},
    {name:"Darwin", tz:"Australia/Darwin"},
    {name:"Perth", tz:"Australia/Perth"},
    {name:"Hobart", tz:"Australia/Hobart"}
  ];
  let html = "";
  cities.forEach(c=>{
    const time = new Date().toLocaleTimeString("en-AU", {timeZone:c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
    html += `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>${c.name}:</span> <span style="color:#ffcc00; font-weight:bold;">${time}</span></div>`;
  });
  document.getElementById("au-time").innerHTML = html;
  document.getElementById("au-date").innerHTML = new Date().toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(updateAUTimes,1000);
updateAUTimes();
</script>

<script>
(function(){
  var KEY='rns_tech_support_layout_v2';
  function save(){
    var data={
      title:document.getElementById('tech-title').innerHTML,
      big:document.getElementById('tech-big-text').innerHTML,
      smalls:[...document.querySelectorAll('.small-pill')].map(e=>e.innerHTML),
      birthday:document.getElementById('hari-box').innerHTML,
      pic:document.getElementById('pic-preview2').src
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  }
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)); if(!d) return;
      if(d.title) document.getElementById('tech-title').innerHTML=d.title;
      if(d.big) document.getElementById('tech-big-text').innerHTML=d.big;
      if(d.smalls){ document.querySelectorAll('.small-pill').forEach((el,i)=>{ if(d.smalls[i]) el.innerHTML=d.smalls[i]; }); }
      if(d.birthday) document.getElementById('hari-box').innerHTML=d.birthday;
      if(d.pic && d.pic.startsWith('data:')){ document.getElementById('pic-preview2').src=d.pic; document.getElementById('pic-preview2').style.display='block'; document.getElementById('pic-label').style.display='none'; }
    }catch(e){}
  }
  document.addEventListener('input', save);
  document.getElementById('pic-input2').addEventListener('change', function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(ev){ document.getElementById('pic-preview2').src=ev.target.result; document.getElementById('pic-preview2').style.display='block'; document.getElementById('pic-label').style.display='none'; save(); }; r.readAsDataURL(f);
  });
  load();
})();
</script>
