<script>
function updateAUTimes(){
  const cities = [
    {name:"Sydney", tz:"Australia/Sydney"},
    {name:"Melbourne", tz:"Australia/Melbourne"},
    {name:"Canberra", tz:"Australia/Canberra"},
    {name:"Brisbane", tz:"Australia/Brisbane"},
    {name:"Adelaide", tz:"Australia/Adelaide"},
    {name:"Darwin", tz:"Australia/Darwin"},
    {name:"Perth", tz:"Australia/Perth"},
    {name:"Hobart", tz:"Australia/Hobart"}
  ];
  let html = "";
  cities.forEach(c=>{
    const time = new Date().toLocaleTimeString("en-AU", {timeZone:c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
    html += `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>${c.name}:</span> <span style="color:#ffcc00; font-weight:bold;">${time}</span></div>`;
  });
  document.getElementById("au-time").innerHTML = html;
  document.getElementById("au-date").innerHTML = new Date().toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(updateAUTimes,1000);
updateAUTimes();
</script>

    <div id="pic-box" style="margin-top:10px; border:2px solid red; min-height:80px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border-radius:8px; cursor:pointer; color:white;" onclick="document.getElementById('pic-input').click()">
      <span id="pic-text">Picture</span><img id="pic-preview" style="display:none; width:100%; height:80px; object-fit:cover; border-radius:6px;">
    </div>
    <input type="file" id="pic-input" accept="image/*" style="display:none;">
  </div>

</div>
</div>

<script>
(function(){
  var KEY='rns_tech_support_v1';
  function save(){
    var data={
      title:document.getElementById('tech-title').innerHTML,
      main:document.getElementById('tech-main-text').innerHTML,
      smalls:[...document.querySelectorAll('.tech-small')].map(e=>e.innerHTML),
      birthday:document.getElementById('hari-birthday').innerHTML,
      pic:document.getElementById('pic-preview').src
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  }
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)); if(!d) return;
      if(d.title) document.getElementById('tech-title').innerHTML=d.title;
      if(d.main) document.getElementById('tech-main-text').innerHTML=d.main;
      if(d.smalls){ document.querySelectorAll('.tech-small').forEach((el,i)=>{ if(d.smalls[i]) el.innerHTML=d.smalls[i]; }); }
      if(d.birthday) document.getElementById('hari-birthday').innerHTML=d.birthday;
      if(d.pic && d.pic.startsWith('data:')){ document.getElementById('pic-preview').src=d.pic; document.getElementById('pic-preview').style.display='block'; document.getElementById('pic-text').style.display='none'; }
    }catch(e){}
  }
  document.addEventListener('input', save);
  document.getElementById('pic-input').addEventListener('change', function(e){
    var file=e.target.files[0]; if(!file) return;
    var r=new FileReader(); r.onload=function(ev){ document.getElementById('pic-preview').src=ev.target.result; document.getElementById('pic-preview').style.display='block'; document.getElementById('pic-text').style.display='none'; save(); }; r.readAsDataURL(file);
  });
  load();
})();
</script>
