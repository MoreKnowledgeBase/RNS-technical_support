<!DOCTYPE html>
<header style="position:relative">
<div id="latest-update-box"></div>
<script>
(function(){
  var box=document.getElementById('latest-update-box');
  if(!box) return;
  var KEY='rns_banner_name_only_final';
  var name="RANDOLF SEGUBAN", message="Dito mo ilalagay yung bday greetings mo.", personPic="", title="Happy Birthday!";
  try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s); name=d.name||name; message=d.message||message; personPic=d.personPic||""; title=d.title||title; } }catch(e){}
  function render(){
    box.innerHTML = `
      <div style="position:relative;width:calc(100% - 300px);margin:40px 20px 25px 260px;min-height:130px;background:rgba(255,255,255,0.12);border:2px dashed rgba(255,255,255,0.5);border-radius:20px;padding:35px 25px 25px;display:flex;justify-content:center;align-items:center;">
        <div style="position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#1e293b;padding:5px 18px;border-radius:99px;font-size:12px;letter-spacing:3px;font-weight:800;border:1px solid rgba(255,255,255,0.3);">📢 LATEST UPDATE</div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:48px;font-weight:900;color:white;letter-spacing:2px;text-transform:uppercase;">${name}</div>
          <div style="font-size:14px;opacity:.7;margin-top:4px;">${message}</div>
        </div>
        <div style="text-align:center;margin-left:20px;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="font-size:18px;font-weight:800;color:white;">${title}</div>
          <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 4px 15px rgba(0,0,0,0.4);background:rgba(255,255,255,0.2);">
            ${personPic ? `<img src="${personPic}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<div style=\\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;\\'>🎂</div>'">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;">🎂</div>`}
          </div>
        </div>
      </div>
    `;
  }
  if(location.search.includes('admin=rns123')){
    var btn=document.createElement('button'); btn.textContent='✏ EDIT BIRTHDAY'; btn.style='position:fixed;bottom:20px;right:20px;z-index:99999;padding:14px 20px;border-radius:99px;border:none;background:#2563eb;color:white;font-weight:700;cursor:pointer;';
    btn.onclick=function(){ 
      var n=prompt('NAME (gitna, malaki):',name); if(n===null)return; 
      var t=prompt('Title sa taas ng picture (ex: Happy Birthday!):',title); if(t===null)return;
      var m=prompt('Greeting sa baba ng NAME:',message); if(m===null)return; 
      var p=prompt('Picture link - i-paste mo yung buong https:// link ng picture:',personPic); if(p===null)return; 
      localStorage.setItem(KEY, JSON.stringify({name:n,title:t,message:m,personPic:p})); location.reload(); 
    }; document.body.appendChild(btn);
  }
  render();
})();
</script>

.team-row:hover .team-members-tooltip{display:block;}
</style>
