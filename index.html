<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNS Technical Support - Knowledge Base</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#222}
header{background:linear-gradient(135deg,#0f172a,#1e40af,#2563eb);color:#fff;padding:20px 16px 30px;position:relative;min-height:380px}
.top-contacts{position:absolute;top:16px;left:20px;display:flex;gap:12px;z-index:10}
.top-contacts a{color:white;text-decoration:none;background:rgba(255,255,255,0.15);padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,0.15)}
.top-contacts img{width:22px;height:22px;border-radius:50%;object-fit:cover}
#aus-time{position:absolute;top:75px;left:15px;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);color:white;padding:14px 16px;border-radius:14px;font-size:12.5px;line-height:1.8;min-width:215px;border:1px solid rgba(255,255,255,0.2);z-index:10}
#aus-time b{color:#facc15}
.main-header-content{text-align:center;padding-top:85px}
.main-header-content .by{font-size:12px;letter-spacing:2px;font-weight:800;opacity:.8}
.main-header-content h1{font-size:42px;line-height:1.1;margin-top:6px}
.main-header-content h1 span{color:#facc15}
.main-header-content p{opacity:.9;max-width:650px;margin:14px auto 22px;font-size:15px;line-height:1.5}
.search{max-width:620px;margin:0 auto;background:#fff;border-radius:999px;display:flex;padding:6px 6px 6px 20px}
.search input{flex:1;border:none;outline:none;font-size:16px}
.search button{background:#2563eb;color:#fff;border:none;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer}
.wrap{max-width:1050px;margin:0 auto;padding:28px 16px 40px}
.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 20px}
.cat{background:#000 !important;color:#fff !important;border:1px solid #444 !important;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;transition:.2s}
.cat.active{background:#ff7f11 !important;color:#000 !important;font-weight:900 !important;border-color:#ff7f11 !important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.15);cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.body{padding:16px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.b1{background:#dbeafe;color:#1d4ed8}.b2{background:#dcfce7;color:#166534}.b3{background:#fef9c3;color:#854d0e}.b4{background:#ffe4e6;color:#be123c}
.card h3
