<!DOCTYPE html>

<style>
  body {
    background: linear-gradient(to right, #0A1931, #2E5BFF);
    margin: 0;
    min-height: 100vh;
    padding: 10px;
    font-family: Arial, sans-serif;

#static-menubar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:42px;
  background:#0a0a0a;
  border-bottom:1px solid rgba(255,255,255,0.12);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:999999;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
#static-menubar .left-phones{display:flex;gap:10px;align-items:center}
#static-menubar .right-menu{display:flex;gap:8px;align-items:center}
#static-menubar .pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  height:28px;
  padding:0 14px;
  border-radius:99px;
  font-weight:800;
  font-size:12px;
  text-decoration:none;
  line-height:1;
  border:1px solid transparent;
  transition:.2s;
  white-space:nowrap;
  cursor:pointer;
}
#static-menubar .pill img{width:18px;height:18px;border-radius:50%;object-fit:cover}
#static-menubar .pill-phone1{background:#FF8A26;color:white;border-color:#FF8A26}
#static-menubar .pill-phone2{background:#FF8A26;color:white;border-color:#FF8A26}
#static-menubar .pill-menu{background:rgba(255,255,255,0.12);color:white;border-color:rgba(255,255,255,0.15)}
#static-menubar .pill-menu:hover{background:#ff7f11;color:#000;border-color:#ff7f11}
#static-menubar .pill-menu.active{background:#ff7f11;color:#000;border-color:#ff7f11}
body{padding-top:42px !important}
#main-content-area, .extra-card{
  width:900px;
  max-width:90%;
  margin:0 auto;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  text-align:center;
}
#main-content-area img, .extra-card img{
  width:100%;
  height:auto;
  max-height:none;
  object-fit:contain;
  object-position:center;
  display:block;
  background:white;
  margin:0;
  padding:0;
}
.sub-pill{
  background:#0a0a0a;
  border:1.5px solid #FF8A26;
  color:white;
  padding:8px 18px;
  border-radius:99px;
  font-weight:800;
  font-size:12px;
  text-decoration:none;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}
.sub-pill:hover{ background:#FF8A26; color:#000; }
.sub-pill.active{ background:#FF8A26; color:#000; }
.center-wrapper{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-top:250px;
  gap:20px;
  padding-bottom:50px;
}
.extra-pics{
  display:flex;
  flex-direction:column;
  gap:20px;
  width:100%;
  align-items:center;
}
</style>

<div style="background:#0f1f3a; color:white; padding:15px; border-radius:15px; width:260px; font-family:Arial; font-size:13px; border:1px solid #333; position:absolute; top:80px; left:15px; z-index:10;">
  <div style="font-weight:bold; text-align:center; margin-bottom:10px;">
    AU AUSTRALIA TIME - LIVE <span style="width:10px; height:10px; background:#00ff88; border-radius:50%; display:inline-block; margin-left:5px;"></span>

  <div id="au-time"></div>
  <div style="margin-top:10px; font-size:11px; color:#aaa; text-align:center;" id="au-date"></div>
</div>

<script>
function updateAUTimes(){
  const cities = [
    {name:"Sydney", tz:"Australia/Sydney"},
    {name:"Melbourne", tz:"Australia/Melbourne"},
    {name:"Canberra", tz:"Australia/Canberra"},
    {name:"Brisbane", tz:"Australia/Brisbane"},
    {name:"Adelaide", tz:"Australia/Adelaide"},
    {name:"Darwin", tz:"Australia/Darwin"},
    {name:"Perth", tz:"Australia/Perth"},
    {name:"Hobart", tz:"Australia/Hobart"}
  ];
  let html = "";
  cities.forEach(c=>{
    const time = new Date().toLocaleTimeString("en-AU", {timeZone:c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
    html += `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>${c.name}:</span> <span style="color:#ffcc00; font-weight:bold;">${time}</span></div>`;
  });
  document.getElementById("au-time").innerHTML = html;
  document.getElementById("au-date").innerHTML = new Date().toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(updateAUTimes,1000);
updateAUTimes();
</script>

<div id="latest-update-box"></div>

<script>
(function(){
  var box=document.getElementById('latest-update-box');
  if(!box) return;
  var KEY='rns_banner_red_circle_final';
  var data={name:"MALAPIT NA ANG 13TH MONTH!!!",small:"MALIGAYANG KAARAWAN",title:"Happy Birthday!",pic:""};
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);data.name=d.name||data.name;data.small=d.small||data.small;data.title=d.title||data.title;data.pic=d.pic||data.pic;}}catch(e){}
  function renderBanner(){
    box.innerHTML=`
      <div style="position:absolute;top:80px;left:350px;right:20px;min-height:130px;background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.5);border-radius:20px;padding:30px 20px 22px;display:flex;justify-content:center;align-items:center;z-index:15;">
        <div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#0f172a;padding:5px 18px;border-radius:99px;font-size:11px;letter-spacing:2px;font-weight:800;border:1px solid rgba(255,255,255,0.3);color:white;white-space:nowrap">📢 LATEST UPDATE</div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:42px;font-weight:900;color:white;letter-spacing:1px;text-transform:uppercase;line-height:1.1;">${data.name}</div>
          <div style="font-size:14px;opacity:.7;margin-top:8px;color:#cbd5e1;">${data.small}</div>
        </div>
        <div style="text-align:center;margin-left:25px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:120px">
          <div style="font-size:15px;font-weight:800;color:white;">${data.title}</div>
          <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 4px 20px rgba(0,0,0,0.4);background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center">
            ${data.pic ? `<img src="${data.pic}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="font-size:42px">🧡</div>`}
          </div>
        </div>
      </div>
    `;
  }
  renderBanner();
})();
</script>

<script>
var subMenuData = {
  'NBN': ['FTTP','FTTC','HFC','FW','FTTN/B'],
  'VoIP': ['No Dial Tone','One Way','No Voice','VoIP Setup','ATA'],
  'Mobile': ['No Data','SIM Issue','APN','Roaming','VoLTE'],
  'Modem': ['Setup','No Internet','WiFi','Bridge','Reset'],
  'Provisioning': ['New Order','Activation','Transfer','Cancel','Track']
};
var contentData = {
  'NBN': { title: 'NBN - NATIONAL BROADBAND NETWORK', desc: 'Select FTTP, FTTC, HFC, FW, FTTN/B above!', pic: 'https://images.unsplash.com/photo-1603899123552-0b6a7a228a6c?w=1200', pic2: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200', pic3: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200', t2: 'SETUP DIAGRAM', d2: 'Wiring / Connection Guide', t3: 'TROUBLESHOOTING', d3: 'Steps to Fix' },
  'FTTP': { title: 'FTTP', desc: 'Fibre to the Premises', pic: 'FTTP outside set up.webp', pic2: 'FTTP old ntd box set up.png', pic3: 'FTTP NBN Box V2.png', t2: 'FTTP INSTALL', d2: 'NBN Box + Connection', t3: 'FTTP CHECK', d3: 'Light Status Guide' },
  'FTTC': { title: 'FTTC', desc: 'Fibre to the Curb', pic: 'FTTC outside set up.webp', pic2: 'FTTC Diagram.jpg', pic3: 'FTTC box.png', t2: 'FTTC SETUP', d2: 'NCD + Modem', t3: 'FTTC TROUBLESHOOT', d3: 'NTD Lights' },
  'HFC': { title: 'HFC', desc: 'Hybrid Fibre Coaxial', pic: 'HFC Diagram.png', pic2: 'HFC set up.png', pic3: 'HFC lights.png', t2: 'HFC SETUP', d2: 'NBN Box Arris', t3: 'HFC TROUBLESHOOT', d3: 'Lights Check' },
  'FW': { title: 'FW', desc: 'Fixed Wireless', pic: 'FW Diagram.png', pic2: 'FW set up.png', pic3: 'FW lights.png', t2: 'FW SETUP', d2: 'Antenna + NTD', t3: 'FW Set Up', d3: 'Signal Check' },
  'FTTN/B': { title: 'FTTN/B', desc: 'Fibre to the Node/Building', pic: 'FTTB Diagram.webp', pic2: 'FTTN Diagram.webp', pic3: 'FTTN Set up.png', t2: 'FTTN SETUP', d2: 'FTTN Diagram', t3: 'FTTN TROUBLESHOOT', d3: 'FTTN Set up' },
  'VoIP': { title: 'VoIP', desc: 'Select VoIP issue above!', pic: 'https://images.unsplash.com/photo-1588502945133-7d4e242d5d6b?w=1200', pic2: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200', pic3: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200', t2: 'VoIP SETUP', d2: 'ATA Config', t3: 'VoIP FIX', d3: 'No Dial Tone' },
  'Mobile': { title: 'MOBILE', desc: 'Select Mobile issue above!', pic: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1200', pic2: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200', pic3: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200', t2: 'MOBILE SETUP', d2: 'APN Config', t3: 'MOBILE FIX', d3: 'No Data' },
  'Modem': { title: 'MODEM', desc: 'Select Modem issue above!', pic: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200', pic2: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200', pic3: 'https://images.unsplash.com/photo-1588502945133-7d4e242d5d6b?w=1200', t2: 'MODEM SETUP', d2: 'WiFi Config', t3: 'MODEM FIX', d3: 'No Internet' },
  'Provisioning': { title: 'PROVISIONING', desc: 'Select Provisioning above!', pic: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=1200', pic2: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200', pic3: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200', t2: 'ORDER TRACK', d2: 'NBN Tracker', t3: 'ACTIVATION', d3: 'Steps' }
};

function setCat(c,el){
  if(el && el.classList.contains('pill-menu')){
    document.querySelectorAll('.pill-menu').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    var subs = subMenuData[c] || [];
    var middle = document.getElementById('middle-pills');
    middle.innerHTML = '';
    subs.forEach(function(name, idx){
      var btn = document.createElement('a');
      btn.href='#';
      btn.className='sub-pill' + (idx===0?' active':'');
      btn.textContent=name;
      btn.onclick=function(e){ e.preventDefault(); setCat(name, this); };
      middle.appendChild(btn);
    });
    if(subs.length>0) c = subs[0];
  } else if(el && el.classList.contains('sub-pill')){
    document.querySelectorAll('.sub-pill').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
  }
  var d = contentData[c];
  if(!d) return;
  document.getElementById('main-pic').src = d.pic;
  document.getElementById('main-title').textContent = d.title;
  document.getElementById('main-desc').textContent = d.desc;
  if(document.getElementById('main-pic2')){
    document.getElementById('main-pic2').src = d.pic2 || d.pic;
    document.getElementById('main-title2').textContent = d.t2 || d.title + ' - Setup';
    document.getElementById('main-desc2').textContent = d.d2 || d.desc;
  }
  if(document.getElementById('main-pic3')){
    document.getElementById('main-pic3').src = d.pic3 || d.pic;
    document.getElementById('main-title3').textContent = d.t3 || d.title + ' - Troubleshoot';
    document.getElementById('main-desc3').textContent = d.d3 || d.desc;
  }
}
window.addEventListener('load', function(){
  var nbnBtn = document.querySelector('.pill-menu');
  if(nbnBtn) setCat('NBN', nbnBtn);
});
</script>
