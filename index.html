<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNS Technical Support - Knowledge Base</title>
<style>
  body {
    background: linear-gradient(to right, #0A1931, #2E5BFF);
    margin: 0;
    min-height: 100vh;
    padding: 10px;
    font-family: Arial, sans-serif;
  }
#static-menubar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:42px;
  background:#0a0a0a;
  border-bottom:1px solid rgba(255,255,255,0.12);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  z-index:999999;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
#static-menubar .left-phones{display:flex;gap:10px;align-items:center}
#static-menubar .right-menu{display:flex;gap:8px;align-items:center}
#static-menubar .pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  height:28px;
  padding:0 14px;
  border-radius:99px;
  font-weight:800;
  font-size:12px;
  text-decoration:none;
  line-height:1;
  border:1px solid transparent;
  transition:.2s;
  white-space:nowrap;
  cursor:pointer;
}
#static-menubar .pill img{width:18px;height:18px;border-radius:50%;object-fit:cover}
#static-menubar .pill-phone1{background:#FF8A26;color:white;border-color:#FF8A26}
#static-menubar .pill-phone2{background:#FF8A26;color:white;border-color:#FF8A26}
#static-menubar .pill-menu{background:rgba(255,255,255,0.12);color:white;border-color:rgba(255,255,255,0.15)}
#static-menubar .pill-menu:hover{background:#ff7f11;color:#000;border-color:#ff7f11}
#static-menubar .pill-menu.active{background:#ff7f11;color:#000;border-color:#ff7f11}
#static-menubar .pill-time{background:#2563eb;color:white;border-color:#2563eb}
body{padding-top:42px !important}
#main-content-area{
  width:calc(100% - 40px);
  max-width:1100px;
  margin:240px auto 20px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  min-height:450px;
}
#main-content-area img{width:100%;max-height:500px;object-fit:cover;display:block;}
.wrap{max-width:1100px;margin:20px auto 0;padding:20px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.2);cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.card .body{padding:16px}
@media(max-width:800px){
  #static-menubar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
  #static-menubar .pill{padding:6px 12px;font-size:11px;height:28px}
  body{padding-top:88px !important}
  #main-content-area{margin-top:320px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav id="static-menubar">
  <div class="left-phones">
    <a href="https://www.tangerine.com.au/" class="pill pill-phone1">
      <img src="peely-speedy-max.png"> 1800 211 112
    </a>
    <a href="https://more.com.au/" class="pill pill-phone2">
      <img src="download.webp"> 1800 733 368
    </a>
  </div>
  <div class="right-menu">
    <a href="#" class="pill pill-menu active" onclick="setCat('NBN',this);return false;">NBN</a>
    <a href="#" class="pill pill-menu" onclick="setCat('VoIP',this);return false;">VoIP</a>
    <a href="#" class="pill pill-menu" onclick="setCat('Mobile',this);return false;">Mobile</a>
    <a href="#" class="pill pill-menu" onclick="setCat('Modem',this);return false;">Modem</a>
    <a href="#" class="pill pill-menu" onclick="setCat('Provisioning',this);return false;">Provisioning</a>
  </div>
</nav>

<div style="background:#0f1f3a; color:white; padding:15px; border-radius:15px; width:260px; font-family:Arial; font-size:13px; border:1px solid #333; position:absolute; top:80px; left:15px; z-index:10;">
  <div style="font-weight:bold; text-align:center; margin-bottom:10px;">
    AU AUSTRALIA TIME - LIVE <span style="width:10px; height:10px; background:#00ff88; border-radius:50%; display:inline-block; margin-left:5px;"></span>
  </div>
  <div id="au-time"></div>
  <div style="margin-top:10px; font-size:11px; color:#aaa; text-align:center;" id="au-date"></div>
</div>

<script>
function updateAUTimes(){
  const cities = [
    {name:"Sydney", tz:"Australia/Sydney"},
    {name:"Melbourne", tz:"Australia/Melbourne"},
    {name:"Canberra", tz:"Australia/Canberra"},
    {name:"Brisbane", tz:"Australia/Brisbane"},
    {name:"Adelaide", tz:"Australia/Adelaide"},
    {name:"Darwin", tz:"Australia/Darwin"},
    {name:"Perth", tz:"Australia/Perth"},
    {name:"Hobart", tz:"Australia/Hobart"}
  ];
  let html = "";
  cities.forEach(c=>{
    const time = new Date().toLocaleTimeString("en-AU", {timeZone:c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
    html += `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>${c.name}:</span> <span style="color:#ffcc00; font-weight:bold;">${time}</span></div>`;
  });
  document.getElementById("au-time").innerHTML = html;
  document.getElementById("au-date").innerHTML = new Date().toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(updateAUTimes,1000);
updateAUTimes();
</script>

<div id="latest-update-box"></div>

<script>
(function(){
  var box=document.getElementById('latest-update-box');
  if(!box) return;
  var KEY='rns_banner_red_circle_final';
  var data={name:"MALAPIT NA ANG 13TH MONTH!!!",small:"MALIGAYANG KAARAWAN",title:"Happy Birthday!",pic:""};
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);data.name=d.name||data.name;data.small=d.small||data.small;data.title=d.title||data.title;data.pic=d.pic||data.pic;}}catch(e){}
  function renderBanner(){
    box.innerHTML=`
      <div style="position:absolute;top:80px;left:350px;right:20px;min-height:130px;background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.5);border-radius:20px;padding:30px 20px 22px;display:flex;justify-content:center;align-items:center;z-index:15;">
        <div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#0f172a;padding:5px 18px;border-radius:99px;font-size:11px;letter-spacing:2px;font-weight:800;border:1px solid rgba(255,255,255,0.3);color:white;white-space:nowrap">📢 LATEST UPDATE</div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:42px;font-weight:900;color:white;letter-spacing:1px;text-transform:uppercase;line-height:1.1;">${data.name}</div>
          <div style="font-size:14px;opacity:.7;margin-top:8px;color:#cbd5e1;">${data.small}</div>
        </div>
        <div style="text-align:center;margin-left:25px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:120px">
          <div style="font-size:15px;font-weight:800;color:white;">${data.title}</div>
          <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 4px 20px rgba(0,0,0,0.4);background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center">
            ${data.pic ? `<img src="${data.pic}" style="width:100%;height:100%;object-fit:cover;">` : `<div style="font-size:42px">🧡</div>`}
          </div>
        </div>
      </div>
    `;
  }
  if(location.search.includes('admin=rns123')){
    var btn=document.createElement('button');
    btn.textContent='✏ EDIT BANNER';
    btn.style='position:fixed;bottom:20px;right:20px;z-index:999999;padding:14px 22px;border-radius:99px;border:none;background:#ff7f11;color:#000;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.4);';
    btn.onclick=function(){
      var n=prompt('1. MALAKING TEXT SA GITNA:',data.name);if(n===null)return;
      var sm=prompt('2. MALIIT NA TEXT SA BABA:',data.small);if(sm===null)return;
      var t=prompt('3. TITLE SA KANAN:',data.title);if(t===null)return;
      var p=prompt('4. PICTURE LINK https://:',data.pic);if(p===null)return;
      localStorage.setItem(KEY,JSON.stringify({name:n,small:sm,title:t,pic:p}));location.reload();
    };
    document.body.appendChild(btn);
  }
  renderBanner();
})();
</script>

<!-- PULA NA BOX - DITO LALABAS PICTURE PAG CLICK NBN, VOIP, MOBILE -->
<div id="main-content-area">
  <img id="main-pic" src="peely-speedy-max.png" style="width:50%;max-height:500px;object-fit:cover;display:block;">
  <div style="padding:25px;text-align:center;background:white;">
    <h2 id="main-title" style="color:#0f172a;font-size:28px;font-weight:900;margin:0;">NBN - NATIONAL BROADBAND NETWORK 22222</h2>
    <p id="main-desc" style="color:#666;margin-top:10px;font-size:14px;">Click mo yung NBN, VoIP, Mobile, Modem, Provisioning sa taas — iba-ibang picture lalabas dito!</p>
  </div>
</div>

<script>
var contentData = {
  'NBN': { title: 'FTTP', desc: 'NBN guides, troubleshooting, at setup. Dito lalabas NBN picture!', pic: 'peely-speedy-max.png' },
  'VoIP': { title: 'VoIP - VOICE OVER IP', desc: 'VoIP phone setup, walang dial tone, at call quality issues.', pic: 'https://images.unsplash.com/photo-1588502945133-7d4e242d5d6b?w=1200&q=80' },
  'Mobile': { title: 'MOBILE SERVICES', desc: 'Mobile data, SIM setup, at mobile internet troubleshooting.', pic: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1200&q=80' },
  'Modem': { title: 'MODEM SETUP GUIDE', desc: 'Modem setup, wifi password, at modem troubleshooting.', pic: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200&q=80' },
  'Provisioning': { title: 'PROVISIONING GUIDE', desc: 'Provisioning ng NBN, activation, at order tracking.', pic: 'https://images.unsplash.com/photo-1563986768609-322da13575f3?w=1200&q=80' }
};

function setCat(c,el){
  document.querySelectorAll('.pill-menu').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  var d = contentData[c];
  if(!d) return;
  document.getElementById('main-pic').src = d.pic;
  document.getElementById('main-title').textContent = d.title;
  document.getElementById('main-desc').textContent = d.desc;
  document.getElementById('main-content-area').scrollIntoView({behavior:'smooth'});
}
</script>

<div class="wrap">
  <div class="grid" id="grid"></div>
</div>

</body>
</html>
