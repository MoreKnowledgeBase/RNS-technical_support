<script>
function updateAUTimes(){
  const cities = [
    {name:"Sydney", tz:"Australia/Sydney"},
    {name:"Melbourne", tz:"Australia/Melbourne"},
    {name:"Canberra", tz:"Australia/Canberra"},
    {name:"Brisbane", tz:"Australia/Brisbane"},
    {name:"Adelaide", tz:"Australia/Adelaide"},
    {name:"Darwin", tz:"Australia/Darwin"},
    {name:"Perth", tz:"Australia/Perth"},
    {name:"Hobart", tz:"Australia/Hobart"}
  ];
  let html = "";
  cities.forEach(c=>{
    const time = new Date().toLocaleTimeString("en-AU", {timeZone:c.tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
    html += `<div style="display:flex; justify-content:space-between; margin:4px 0;"><span>${c.name}:</span> <span style="color:#ffcc00; font-weight:bold;">${time}</span></div>`;
  });
  document.getElementById("au-time").innerHTML = html;
  document.getElementById("au-date").innerHTML = new Date().toLocaleDateString("en-AU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
setInterval(updateAUTimes,1000);
updateAUTimes();
</script>

<script>
(function(){
  var box=document.getElementById('latest-update-box');
  if(!box) return;
  var KEY='rns_banner_red_circle_final';
  var data={name:"MALAPIT NA ANG 13TH MONTH!!!",small:"MALIGAYANG KAARAWAN",title:"Happy Birthday!",pic:""};
  try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);data.name=d.name||data.name;data.small=d.small||data.small;data.title=d.title||data.title;data.pic=d.pic||data.pic;}}catch(e){}
  function renderBanner(){
    box.innerHTML=`
      <div style="position:absolute;top:80px;left:350px;right:20px;min-height:130px;background:rgba(255,255,255,0.08);border:1.5px dashed rgba(255,255,255,0.5);border-radius:20px;padding:30px 20px 22px;display:flex;justify-content:center;align-items:center;z-index:15;">
        <div style="position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#0f172a;padding:5px 18px;border-radius:99px;font-size:11px;letter-spacing:2px;font-weight:800;border:1px solid rgba(255,255,255,0.3);color:white;white-space:nowrap">📢 LATEST UPDATE</div>
        <div style="flex:1;text-align:center;">
          <div style="font-size:42px;font-weight:900;color:white;letter-spacing:1px;text-transform:uppercase;line-height:1.1;">${data.name}</div>
          <div style="font-size:14px;opacity:.7;margin-top:8px;color:#cbd5e1;">${data.small}</div>
        </div>
        <div style="text-align:center;margin-left:25px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:120px">
          <div style="font-size:15px;font-weight:800;color:white;">${data.title}</div>
          <div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid white;box-shadow:0 4px 20px rgba(0,0,0,0.4);background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center">
            ${data.pic ? `<img src="${data.pic}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<div style=\\'font-size:40px\\'>🧡</div>'">` : `<div style="font-size:42px">🧡</div>`}
          </div>
        </div>
      </div>
    `;
  }
  if(location.search.includes('admin=rns123')){
    var btn=document.createElement('button');
    btn.textContent='✏ EDIT BANNER';
    btn.style='position:fixed;bottom:20px;right:20px;z-index:999999;padding:14px 22px;border-radius:99px;border:none;background:#ff7f11;color:#000;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.4);';
    btn.onclick=function(){
      var n=prompt('1. MALAKING TEXT SA GITNA:',data.name);if(n===null)return;
      var sm=prompt('2. MALIIT NA TEXT SA BABA:',data.small);if(sm===null)return;
      var t=prompt('3. TITLE SA KANAN:',data.title);if(t===null)return;
      var p=prompt('4. PICTURE LINK https://:',data.pic);if(p===null)return;
      localStorage.setItem(KEY,JSON.stringify({name:n,small:sm,title:t,pic:p}));location.reload();
    };
    document.body.appendChild(btn);
  }
  renderBanner();
})();
</script>
