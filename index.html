<title>RNS Technical Support - Knowledge Base</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f4ff;color:#222}
header{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;text-align:center;padding:48px 16px 60px;position:relative}
header h1{font-size:38px;line-height:1.1}
header h1 span{color:#facc15}
header p{opacity:.9;max-width:600px;margin:14px auto 22px;font-size:16px}
.search{max-width:620px;margin:0 auto;background:#fff;border-radius:999px;display:flex;padding:6px 6px 6px 20px}
.search input{flex:1;border:none;outline:none;font-size:16px}
.search button{background:#2563eb;color:#fff;border:none;padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer}
.wrap{max-width:1000px;margin:-28px auto 0;padding:0 16px 40px}
.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 20px}
.cat{background:#000 !important;color:#fff !important;border:1px solid #444 !important;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.cat.active{background:#ff7f11 !important;color:#000 !important;font-weight:900 !important;border-color:#ff7f11 !important}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.07);cursor:pointer}
.card img{width:100%;height:150px;object-fit:cover}
.body{padding:16px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.b1{background:#dbeafe;color:#1d4ed8}.b2{background:#dcfce7;color:#166534}.b3{background:#fef9c3;color:#854d0e}.b4{background:#ffe4e6;color:#be123c}
.card h3{font-size:16px;line-height:1.3;margin-bottom:6px}
.card p{font-size:13.5px;color:#666;line-height:1.5}
.foot{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#999}
.section{background:#fff;border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.section h2{margin-bottom:12px}
video{width:100%;border-radius:14px;background:#000}
.faq{border-bottom:1px solid #eee;padding:14px 0;cursor:pointer}
.faq p{display:none;color:#555;margin-top:8px;line-height:1.6;font-size:14px}
.faq.open p{display:block}
footer{text-align:center;padding:24px;color:#888;font-size:13px}
#noResult{display:none;text-align:center;padding:20px;color:#888}
.team-row{position:relative;cursor:pointer}
.team-members-tooltip{display:none;position:absolute;left:105%;top:0;background:#111827;border:1px solid #374151;border-radius:10px;padding:10px 14px;min-width:160px;z-index:9999}
.team-row:hover .team-members-tooltip{display:block}
</style>
</head>
